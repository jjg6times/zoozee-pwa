<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jarvis" />
  <meta name="theme-color" content="#0f1626" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Jarvis Remote</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ============================ LOGIN ============================ -->
  <section id="screen-login" class="screen">
    <div class="login-card">
      <div class="brand">
        <div class="brand-icon">J</div>
        <h1>Jarvis Remote</h1>
        <p class="sub">ZOOZEE Z70 / Slamtec cloud</p>
        <p class="ver-stamp">build v39</p>
      </div>
      <form id="login-form" autocomplete="on">
        <label>Email / account</label>
        <input id="login-email" type="text" inputmode="email" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="you@example.com" />
        <label>Password</label>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" />
        <button id="login-btn" type="submit">Sign in</button>
        <label class="remember-row">
          <input id="login-remember" type="checkbox" />
          <span>Remember me</span>
        </label>
      </form>
      <p id="login-msg" class="msg"></p>
    </div>
  </section>

  <!-- ============================ MAIN ============================ -->
  <section id="screen-main" class="screen hidden">
    <header class="topbar">
      <div class="title-wrap">
        <h2 id="dev-name">Jarvis</h2>
        <span id="dev-sub" class="dev-sub muted">connecting…</span>
      </div>
      <div class="pill-row">
        <span id="pill-online" class="pill off">Offline</span>
        <span id="pill-battery" class="pill">–%</span>
        <span id="pill-charge" class="pill">–</span>
      </div>
    </header>

    <div id="banner" class="banner hidden"></div>

    <main>
      <div class="map-wrap">
        <canvas id="map"></canvas>
        <div class="map-tools">
          <button class="zoom" id="btn-zoom-in" title="Zoom in">＋</button>
          <button class="zoom" id="btn-zoom-out" title="Zoom out">－</button>
          <button class="zoom" id="btn-zoom-fit" title="Reset view">fit</button>
          <button class="zoom" id="btn-map-refresh" title="Refresh map from robot">⟳</button>
        </div>
        <div id="map-status" class="map-status muted">Waiting for map…</div>
      </div>

      <div class="panel">
        <div class="panel-title">Status</div>
        <div id="action-line" class="status-line">Idle</div>
        <div id="pos-line" class="status-line muted">pose: waiting for robot…</div>
        <div id="wifi-line" class="status-line muted small">WiFi: —</div>
        <div class="opt-row">
          <button class="ctrl sm" id="btn-check-now">Check robot now</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Controls</div>
        <div class="btn-grid">
          <button class="ctrl" id="btn-sweep">Sweep all</button>
          <button class="ctrl" id="btn-edge">Edge</button>
          <button class="ctrl" id="btn-spot">Spot region</button>
          <button class="ctrl warn" id="btn-stop">Stop</button>
          <button class="ctrl" id="btn-home">Go home</button>
          <button class="ctrl" id="btn-find">Find me</button>
        </div>
        <p id="ctrl-msg" class="msg"></p>
      </div>

      <div class="panel">
        <div class="panel-title">Sweep options</div>
        <div class="opt-row">
          <label for="fan-mode">Suction</label>
          <select id="fan-mode" disabled></select>
        </div>
        <div class="opt-row opt-check">
          <label for="carpet-boost">Carpet boost (auto suction)</label>
          <input id="carpet-boost" type="checkbox" disabled />
        </div>
        <div class="opt-row wall-row">
          <span>No-go walls</span>
          <button class="ctrl sm" id="btn-wall">＋ Wall</button>
          <button class="ctrl sm" id="btn-wall-clear" disabled>Clear</button>
          <button class="ctrl sm ok" id="btn-wall-save" disabled>Save</button>
        </div>
        <p id="wall-status" class="status-line muted small"></p>
        <div class="opt-row wall-row">
          <span>No-go zones</span>
          <button class="ctrl sm" id="btn-nogo">＋ Zone</button>
          <button class="ctrl sm" id="btn-nogo-clear" disabled>Clear</button>
          <button class="ctrl sm ok" id="btn-nogo-save" disabled>Save</button>
        </div>
        <p id="nogo-status" class="status-line muted small"></p>
        <button class="ctrl warn ghost" id="btn-all-clear">Reset map on robot</button>
        <button class="ctrl ok ghost" id="btn-remap">Reset map + map again</button>
      </div>

      <div class="panel" id="maps-panel">
        <div class="panel-title">Maps</div>
        <div class="opt-row">
          <button class="ctrl sm" id="btn-save-map">Save current map</button>
          <button class="ctrl sm" id="btn-load-robot">Load from robot</button>
          <button class="ctrl sm ok hidden" id="btn-live-map">Back to live</button>
        </div>
        <p id="map-label" class="status-line muted small"></p>
        <div id="saved-maps" class="maplist"></div>
        <div id="cloud-maps" class="maplist"></div>
      </div>

      <div class="panel" id="schedule-panel">
        <div class="panel-title">Schedule</div>
        <div id="schedule-list" class="muted">…</div>
        <div class="sched-form">
          <div class="sched-days" id="sched-days"></div>
          <div class="sched-presets" id="sched-presets">
            <button type="button" class="chip" data-mask="127">Every day</button>
            <button type="button" class="chip" data-mask="62">Weekdays</button>
            <button type="button" class="chip" data-mask="65">Weekends</button>
            <button type="button" class="chip" data-mask="0">Once</button>
          </div>
          <div class="sched-row">
            <input id="sched-time" type="time" />
            <select id="sched-task">
              <option value="sweep">Sweep</option>
              <option value="smart">Smart</option>
            </select>
            <select id="sched-duration">
              <option value="360">Unlimited</option>
              <option value="30">30 min</option>
              <option value="60">60 min</option>
              <option value="90">90 min</option>
              <option value="120">120 min</option>
            </select>
          </div>
          <button class="ctrl" id="btn-add-sched">Add schedule</button>
        </div>
        <p id="sched-msg" class="msg"></p>
      </div>

      <div class="panel" id="history-panel">
        <div class="panel-title">Cleaning history</div>
        <div id="history-summary" class="status-line muted small"></div>
        <div id="history-list" class="maplist"></div>
        <button class="ctrl sm ghost" id="btn-history-clear">Clear history</button>
      </div>

      <div class="panel">
        <div class="panel-title">Account / debug</div>
        <div id="account-line" class="status-line muted"></div>
        <div id="log-box" class="log muted"></div>
        <button id="btn-copy-log" class="ctrl sm">Copy diagnostics</button>
        <button id="btn-clear-cache" class="ctrl sm warn ghost">Clear cache &amp; reload</button>
        <button id="btn-logout" class="ctrl ghost">Sign out</button>
      </div>
    </main>
  </section>

  <script src="js/rle.js"></script>
  <script src="js/mqtt.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
